# fly.toml app configuration file generated for connecting-relay-server on 2026-07-29T20:01:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'connecting-relay-server'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
